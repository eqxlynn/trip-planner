<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日本旅行・行程規劃助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/planner.css">

    <!-- Tailwind CDN 只會處理 inline 的 text/tailwindcss，因此 @apply 元件樣式保留於此 -->
    <style type="text/tailwindcss">
        @layer components {
            /* 統一標題風格 (列印時自動放大為 xl) */
            .ui-title {
                @apply font-bold text-lg leading-snug tracking-wide print:text-slate-900 print:text-xl
            }
            /* 統一內文與列表風格 (列印時自動放大為 lg) */
            .ui-desc {
                @apply text-sm text-slate-600 leading-relaxed print:text-slate-700 print:text-lg;
            }
            /* 統一虛線按鈕風格 */
            .ui-btn-dashed {
                @apply w-full py-3 border-2 mt-2 border-slate-300 text-slate-500 rounded-xl hover:border-emerald-400 hover:text-emerald-600 transition-colors items-center justify-center gap-2 text-sm font-bold bg-slate-50 hover:bg-emerald-50;
            }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased transition-colors duration-300 print:bg-white">

    <!-- 隱藏的列印專用容器 -->
    <div id="print-container" class="hidden font-sans bg-white"></div>

    <!-- 頂部漸層導航欄 -->
    <header id="main-header" class="bg-gradient-to-r from-slate-800 via-slate-750 to-gray-700 text-white shadow-md transition-all duration-500">
        <div class="max-w-[1400px] mx-auto px-6 py-4 flex flex-col md:flex-row items-center justify-between gap-4">

            <div class="flex items-center space-x-3.5">
                <div class="p-2 bg-white/15 rounded-xl backdrop-blur-sm shadow-inner">
                    <i data-lucide="map" class="w-7 h-7 text-teal-200" id="header-icon"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-black tracking-wider flex items-center gap-2" id="header-title">
                        載入中...
                    </h1>
                    <p class="text-xs text-teal-100/90 font-medium tracking-wide mt-0.5" id="header-subtitle">
                        載入中...
                    </p>
                </div>
            </div>

            <!-- 操作按鈕區塊 (shrink-0 避免被標題擠壓) -->
            <div class="shrink-0 flex items-center space-x-1 bg-black/15 p-1 rounded-xl backdrop-blur-sm border border-white/5">

                <!-- 編輯模式切換 -->
                <button id="btn-toggle-edit" class="px-2.5 py-1 text-[11px] font-bold rounded-lg transition-all duration-200 bg-white/10 hover:bg-white/20 text-white flex items-center gap-1">
                    <i data-lucide="edit-3" class="w-4 h-4 shrink-0"></i>
                    <span class="text-sm font-medium whitespace-nowrap">編輯模式</span>
                </button>

                <span class="w-[1px] h-4 bg-white/20 mx-1"></span> <!-- 分隔線 -->

                <!-- 列印小冊子 -->
                <button id="btn-print" class="px-2.5 py-1 text-[11px] font-bold rounded-lg transition-all duration-200 bg-white/10 hover:bg-white/20 text-white flex items-center gap-1">
                    <i data-lucide="printer" class="w-4 h-4 shrink-0"></i>
                    <span class="text-sm font-medium whitespace-nowrap">小冊子</span>
                </button>
            </div>

        </div>
    </header>

    <!-- 主內容區 (三欄佈局) -->
    <main class="flex-grow max-w-[1400px] w-full mx-auto px-6 py-6 flex flex-col lg:flex-row gap-2">

        <!-- 左側欄：天數選單 -->
        <aside class="w-full lg:w-64 shrink-0 flex flex-col gap-4 sticky top-0 z-50 lg:top-6 lg:self-start">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4">
                <h2 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-3 flex items-center justify-between">
                    <span>每日行程</span>
                    <i data-lucide="navigation" class="w-4 h-4"></i>
                </h2>

                <!-- 手機版可橫向滑動 (隱藏滑動條)；電腦版完整顯示 -->
                <nav id="day-nav" class="flex lg:flex-col overflow-x-auto lg:overflow-visible space-x-2 lg:space-x-0 lg:space-y-1.5 pb-2 lg:pb-0 scroll-smooth snap-x no-scrollbar">
                    <!-- 由 JS 動態生成 -->
                </nav>
                <button id="btn-add-day" class="hidden ui-btn-dashed">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>新增天數</span>
                </button>
            </div>
        </aside>

        <!-- 中間欄：本日內容 (時間軸) -->
        <section id="main-content-section" class="flex-grow bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6 flex flex-col gap-4 min-w-0">
            <div class="flex items-center gap-3 border-b border-slate-100 pb-4 break-inside-avoid">

                <!-- 打孔日曆 Icon (編輯模式點擊可更改日期) -->
                <div class="relative shrink-0">
                    <div id="detail-calendar-icon-container"></div>
                    <input type="date" id="detail-date-input" class="absolute bottom-0 left-0 w-px h-px opacity-0 pointer-events-none" tabindex="-1" aria-label="更改日期">
                </div>

                <!-- 主標題與地區 -->
                <div class="flex flex-col items-start gap-2">
                    <h2 id="detail-title" class="text-3xl font-black text-slate-900 leading-tight">載入中...</h2>

                    <!-- 住宿 / 講義 (subtitle)；圖示依主題由 view.js 填入；edit-reveal：沒有資料時在編輯模式仍顯示，方便新增 -->
                    <div id="detail-subtitle-container" class="hidden edit-reveal flex items-center gap-1 text-sm font-medium text-slate-500">
                        <span id="detail-subtitle-icon" class="day-only inline-flex"></span>
                        <span id="detail-subtitle-txt" data-placeholder="新增住宿"></span>
                    </div>

                    <div id="detail-region-container" class="hidden edit-reveal day-only">
                        <span id="detail-region" class="inline-flex items-center text-xs font-bold px-2.5 py-1 rounded-md transition-colors duration-300">
                            <span id="detail-region-txt" data-placeholder="新增地區">MAIN</span>
                        </span>
                    </div>
                </div>

                <!-- 編輯模式：刪除本日 -->
                <button id="btn-delete-day" type="button" class="edit-only-ui day-only hidden ml-auto self-start shrink-0 flex items-center gap-1 px-2 py-1 rounded-md text-xs text-slate-400 hover:text-rose-600 hover:bg-rose-50 transition-colors" title="刪除本日">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">刪除本日</span>
                </button>
            </div>

            <!-- 資料載入失敗警示 -->
            <div id="fallback-warning" class="hidden bg-red-50 border border-red-200 rounded-2xl p-2 text-red-800">
                <div class="flex items-start space-x-3">
                    <i data-lucide="alert-octagon" class="w-5 h-5 text-red-600 shrink-0 mt-0.5"></i>
                    <div class="min-w-0 flex-1">
                        <h3 class="font-bold text-sm">數據檔載入失敗！</h3>
                        <div class="text-xs text-red-700/90 mt-1" id="fallback-reason-text"></div>
                    </div>
                </div>
            </div>

            <!-- 時間軸 (封面不顯示) -->
            <div class="day-only">
                <h3 class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4 flex items-center space-x-2">
                    <i data-lucide="clock" class="w-4 h-4"></i>
                    <span>TIMELINE</span>
                </h3>
                <div id="detail-timeline" class="relative ml-3 border-l border-slate-200 space-y-4"></div>
            </div>
            <button id="btn-add-timeline" class="day-only hidden ui-btn-dashed">
                <i data-lucide="plus-circle" class="w-5 h-5"></i>
                <span>新增行程</span>
            </button>
            <!-- 每日 guides；選取「封面」時顯示 metadata.guides -->
            <div id="detail-guides" class="relative ml-3 space-y-4"></div>
            <button id="btn-add-guide" class="cover-only edit-only-ui flex ui-btn-dashed">
                <i data-lucide="plus-circle" class="w-5 h-5 shrink-0"></i>
                <span>新增封面指南</span>
            </button>
        </section>

        <!-- 右側欄：每日提示 (封面不顯示) -->
        <aside class="day-only w-full lg:w-64 shrink-0 flex flex-col gap-4">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-4 flex flex-col">
                <h2 class="text-xs font-black text-slate-400 uppercase mb-4">Daily Tips</h2>
                <div id="tips-container" class="flex flex-col gap-4"></div>
                <button id="btn-add-tip" class="hidden ui-btn-dashed">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i>
                    <span>新增 Tip</span>
                </button>
            </div>
        </aside>
    </main>

    <!-- 底部：預算表 (無花費資料時隱藏) -->
    <section id="budget-section" class="hidden lg:flex max-w-[1400px] w-full mx-auto px-6 mb-4 mt-2">
        <div class="w-full bg-white rounded-2xl shadow-sm border border-slate-100 p-5 sm:p-6">

            <div class="lg:flex items-center gap-2 mb-6 border-b border-slate-100 pb-3">
                <i data-lucide="wallet" class="w-5 h-5 text-emerald-600" id="wallet-icon"></i>
                <h3 class="text-lg font-black text-slate-900">預算表</h3>
            </div>

            <!-- 雙欄佈局 (左 7 : 右 5) -->
            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

                <!-- 左欄：詳細費用 -->
                <div class="lg:col-span-7 flex flex-col h-full">
                    <h4 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                        <i data-lucide="list" class="w-4 h-4 text-slate-500"></i>
                        詳細費用
                    </h4>
                    <div id="expense-list" class="space-y-1 text-sm bg-slate-50 p-4 rounded-xl border border-slate-100 flex-grow max-h-[500px] overflow-y-auto"></div>
                </div>

                <!-- 右欄：各類統計 -->
                <div class="lg:col-span-5 flex flex-col gap-6">
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm mb-3 flex items-center gap-2">
                            <i data-lucide="pie-chart" class="w-4 h-4 text-slate-500"></i>
                            各類統計
                        </h4>
                        <div id="budget-cards-container" class="grid grid-cols-2 gap-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- 底部版權 -->
    <footer class="bg-slate-900 text-slate-400 py-6 border-t border-slate-800 text-xs">
        <div class="max-w-[1400px] mx-auto px-6 text-center flex flex-col sm:flex-row items-center justify-between gap-4">
            <p>© 2026 行程規劃助手 | 本地直接點擊執行</p>
            <p class="flex items-center space-x-2 justify-center">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
                <span id="data-status-txt">資料加載成功</span>
            </p>
        </div>
    </footer>

    <!-- 右下角浮動按鈕：編輯模式顯示 Save，檢視模式顯示匯出 -->
    <button id="btn-save" class="hidden fixed bottom-8 right-8 bg-slate-800 text-white px-5 py-3 rounded-full shadow-xl hover:bg-slate-700 hover:shadow-2xl transition-all duration-200 items-center gap-2 z-50 print:hidden">
        <i data-lucide="save" class="w-5 h-5"></i>
        <span class="font-medium tracking-wide">Save</span>
        <span id="save-dirty-dot" class="hidden w-2 h-2 rounded-full bg-amber-400" title="有未儲存的變更"></span>
    </button>
    <button id="btn-export-json" class="fixed bottom-8 right-8 bg-slate-800 text-white px-5 py-3 rounded-full shadow-xl hover:bg-slate-700 hover:shadow-2xl transition-all duration-200 flex items-center gap-2 z-50 print:hidden">
        <i data-lucide="download" class="w-5 h-5"></i>
        <span class="font-medium tracking-wide">匯出</span>
    </button>

    <!-- 核心模組 -->
    <script src="js/core/config.js"></script>
    <script src="js/core/dom.js"></script>
    <script src="js/core/date.js"></script>
    <script src="js/core/storage.js"></script>
    <script src="js/core/markdown.js"></script>
    <script src="js/core/drive.js"></script>
    <script src="js/theme.js"></script>
    <!-- 行程頁模組 -->
    <script src="js/planner/components.js"></script>
    <script src="js/planner/budget.js"></script>
    <script src="js/planner/print.js"></script>
    <script src="js/planner/export.js"></script>
    <script src="js/planner/view.js"></script>
    <script src="js/planner/editor.js"></script>
    <script src="js/planner/app.js"></script>
</body>
</html>
